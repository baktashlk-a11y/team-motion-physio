<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recovery Beyond Clinic · Prototype</title>
    <link rel="stylesheet" href="sharedComponents/designSystem.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: var(--font-body);
        color: var(--text);
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-family: var(--font-title);
        font-weight: 600;
        font-size: 2.25rem;
        margin: 0 0 0.5rem;
      }
      h1 em {
        font-weight: 400;
      }
      p {
        color: var(--text-secondary);
        margin: 0 0 2rem;
      }
      .pick {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .pick a {
        display: block;
        width: 15rem;
        padding: 1.5rem;
        border-radius: 1rem;
        background: #fff;
        border: 1px solid var(--border);
        text-decoration: none;
        color: var(--text);
        text-align: left;
      }
      .pick a:hover {
        border-color: var(--forest);
      }
      .pick strong {
        display: block;
        font-size: 1.125rem;
        margin-bottom: 0.25rem;
      }
      .pick span {
        color: var(--text-secondary);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Recovery <em>Beyond Clinic</em></h1>
      <p>Team Motion · IAT 334 · Interactive prototype</p>
      <div class="pick">
        <a href="pt/index.html"
          ><strong>PT workspace</strong
          ><span
            >Jordan Lee reviews Maya's week and updates her must-dos.</span
          ></a
        >
        <a href="patient/index.html"
          ><strong>Patient app</strong
          ><span
            >Maya's exercises and check-ins in an iPhone-sized app.</span
          ></a
        >
      </div>
    </main>
  </body>
</html>
